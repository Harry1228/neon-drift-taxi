<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crazy Taxi 2D Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #222; color: #fff; font-family: "Impact", "Arial Black", sans-serif; overflow: hidden; touch-action: none; }

    /* Crazy Taxi Arcade HUD */
    #hud {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 10;
    }
    
    /* Countdown Timer (Top-Left) */
    #timer-box {
      background: #000; border: 3px solid #ffcc00; border-radius: 6px;
      padding: 4px 10px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
    #timer-val {
      font-size: 32px; color: #ff2200; text-shadow: 2px 2px 0 #ffe600, -1px -1px 0 #000;
      letter-spacing: 2px;
    }
    #timer-sub { font-size: 10px; color: #ffcc00; letter-spacing: 1px; }

    /* Crazy Taxi Roller Meter (Top-Right) */
    #meter-box {
      background: #ffcc00; border: 3px solid #b8860b; border-radius: 6px;
      padding: 4px 8px; text-align: right; box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
    .roller-line {
      background: #111; color: #00ff66; font-family: "Courier New", monospace;
      font-weight: 900; font-size: 16px; padding: 2px 6px; border-radius: 3px;
      letter-spacing: 2px; margin-bottom: 3px; border: 1px solid #333;
    }
    .roller-label { font-size: 9px; color: #333; font-weight: bold; }

    /* Gear Indicator (Bottom-Right) */
    #gear-box {
      position: absolute; bottom: 105px; right: 20px;
      background: #ffcc00; border: 3px solid #333; border-radius: 6px;
      padding: 4px 8px; text-align: center; font-size: 18px; font-weight: 900;
      color: #111; z-index: 10; pointer-events: none;
    }
    .gear-active { background: #ff2200; color: #fff; padding: 2px 6px; border-radius: 4px; }

    canvas { display: block; width: 100vw; height: 100vh; }

    /* On-Screen Driving Controls */
    .touch-controls {
      position: absolute; bottom: 20px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 20px;
      pointer-events: none; z-index: 20;
    }
    .btn-group { display: flex; gap: 12px; pointer-events: auto; }
    .t-btn {
      width: 68px; height: 68px; border-radius: 50%; border: 3px solid #ffcc00;
      background: rgba(0, 0, 0, 0.65); color: #fff; font-size: 26px; font-weight: bold;
      display: flex; align-items: center; justify-content: center; touch-action: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }
    .t-btn:active { background: #ffcc00; color: #000; }
    .pedal-gas { background: rgba(0, 180, 0, 0.6); border-color: #00ff66; }
    .pedal-brake { background: rgba(200, 0, 0, 0.6); border-color: #ff3333; }
  </style>
</head>
<body>

  <!-- Retro HUD -->
  <div id="hud">
    <div id="timer-box">
      <div id="timer-val">45"00</div>
      <div id="timer-sub">TIME LIMIT</div>
    </div>

    <div id="meter-box">
      <div class="roller-label">FARE</div>
      <div class="roller-line" id="fare-val">$000.00</div>
      <div class="roller-label">TOTAL EARNED</div>
      <div class="roller-line" id="total-val">$000.00</div>
    </div>
  </div>

  <div id="gear-box">
    <span id="gear-d" class="gear-active">D</span> | <span id="gear-r">R</span>
  </div>

  <canvas id="game"></canvas>

  <!-- Mobile Touch Pedals & Steering -->
  <div class="touch-controls">
    <div class="btn-group">
      <div class="t-btn" id="btn-left">◀</div>
      <div class="t-btn" id="btn-right">▶</div>
    </div>
    <div class="btn-group">
      <div class="t-btn pedal-brake" id="btn-brake">R</div>
      <div class="t-btn pedal-gas" id="btn-gas">GAS</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const timerVal = document.getElementById("timer-val");
    const fareVal = document.getElementById("fare-val");
    const totalVal = document.getElementById("total-val");
    const gearD = document.getElementById("gear-d");
    const gearR = document.getElementById("gear-r");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // Sound FX Generator
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }
    function playBeep(freq, type = "sine", duration = 0.15) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Game Variables
    let totalScore = 0;
    let currentFare = 0;
    let timeLeft = 45.0;
    let hasPassenger = false;
    let waveTick = 0;

    const car = {
      x: canvas.width / 2, y: canvas.height * 0.7,
      speed: 0, angle: -Math.PI / 2,
      maxSpeed: 6.8, accel: 0.28, friction: 0.94, turnSpeed: 0.075
    };

    // Customer & Destination
    let customer = { x: 140, y: 180, r: 52, active: true };
    let dropoff = { x: canvas.width - 140, y: 220, r: 52, active: false };

    // Keyboard & Touch Inputs
    const keys = { left: false, right: false, gas: false, brake: false };

    window.addEventListener("keydown", (e) => {
      initAudio();
      if (e.key === "a" || e.key === "ArrowLeft") keys.left = true;
      if (e.key === "d" || e.key === "ArrowRight") keys.right = true;
      if (e.key === "w" || e.key === "ArrowUp") keys.gas = true;
      if (e.key === "s" || e.key === "ArrowDown") keys.brake = true;
    });
    window.addEventListener("keyup", (e) => {
      if (e.key === "a" || e.key === "ArrowLeft") keys.left = false;
      if (e.key === "d" || e.key === "ArrowRight") keys.right = false;
      if (e.key === "w" || e.key === "ArrowUp") keys.gas = false;
      if (e.key === "s" || e.key === "ArrowDown") keys.brake = false;
    });

    function bindTouch(id, action) {
      const el = document.getElementById(id);
      el.addEventListener("touchstart", (e) => { e.preventDefault(); initAudio(); keys[action] = true; });
      el.addEventListener("touchend", (e) => { e.preventDefault(); keys[action] = false; });
    }
    bindTouch("btn-left", "left");
    bindTouch("btn-right", "right");
    bindTouch("btn-gas", "gas");
    bindTouch("btn-brake", "brake");

    function formatNumber(num) {
      return num.toFixed(2).padStart(6, "0");
    }

    function gameLoop() {
      // 1. Countdown Timer
      if (timeLeft > 0) {
        timeLeft -= 1 / 60;
        const sec = Math.floor(timeLeft);
        const ms = Math.floor((timeLeft % 1) * 100);
        timerVal.innerText = `${sec.toString().padStart(2, "0")}'${ms.toString().padStart(2, "0")}`;
      } else {
        timerVal.innerText = "00'00";
      }

      // 2. Car Dynamics & Gear Display
      if (Math.abs(car.speed) > 0.4) {
        const dir = car.speed >= 0 ? 1 : -1;
        if (keys.left) car.angle -= car.turnSpeed * dir;
        if (keys.right) car.angle += car.turnSpeed * dir;
      }

      if (keys.gas) {
        car.speed = Math.min(car.speed + car.accel, car.maxSpeed);
      } else if (keys.brake) {
        car.speed = Math.max(car.speed - car.accel * 1.2, -car.maxSpeed * 0.45);
      } else {
        car.speed *= car.friction;
      }

      // Update Gear UI
      if (car.speed < -0.2) {
        gearD.className = "";
        gearR.className = "gear-active";
      } else {
        gearD.className = "gear-active";
        gearR.className = "";
      }

      car.x += Math.cos(car.angle) * car.speed;
      car.y += Math.sin(car.angle) * car.speed;

      // Keep within bounds
      car.x = Math.max(30, Math.min(canvas.width - 30, car.x));
      car.y = Math.max(30, Math.min(canvas.height - 30, car.y));

      const isStopped = Math.abs(car.speed) < 0.4;
      waveTick += 0.08;

      // 3. Pickup Logic
      if (!hasPassenger && customer.active) {
        const d = Math.hypot(car.x - customer.x, car.y - customer.y);
        if (d < customer.r && isStopped) {
          hasPassenger = true;
          customer.active = false;
          dropoff.x = Math.random() * (canvas.width - 240) + 120;
          dropoff.y = Math.random() * (canvas.height - 340) + 170;
          dropoff.active = true;
          timeLeft += 15.0; // Bonus time
          currentFare = 45.00;
          fareVal.innerText = "$" + formatNumber(currentFare);
          playBeep(520, "triangle", 0.2);
          playBeep(780, "sine", 0.3);
        }
      }

      // 4. Dropoff Logic
      if (hasPassenger && dropoff.active) {
        const d = Math.hypot(car.x - dropoff.x, car.y - dropoff.y);
        if (d < dropoff.r && isStopped) {
          hasPassenger = false;
          dropoff.active = false;
          totalScore += currentFare;
          totalVal.innerText = "$" + formatNumber(totalScore);
          currentFare = 0;
          fareVal.innerText = "$000.00";
          playBeep(660, "sine", 0.15);
          playBeep(990, "triangle", 0.4);

          setTimeout(() => {
            customer.x = Math.random() * (canvas.width - 240) + 120;
            customer.y = Math.random() * (canvas.height - 340) + 170;
            customer.active = true;
          }, 1200);
        }
      }

      // RENDER CITY SCENE
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // A. Asphalt Road
      ctx.fillStyle = "#696969";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // B. Road Markings (White lane dashes)
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 4;
      ctx.setLineDash([20, 20]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // C. Sidewalks with Checkered Tiles (Top & Bottom)
      drawSidewalk(0, 0, canvas.width, 110);
      drawSidewalk(0, canvas.height - 90, canvas.width, 90);

      // D. Red Brick Building Blocks
      drawBuilding(20, 10, 180, 80);
      drawBuilding(240, 10, 200, 80);

      // E. Draw Customer (Sidewalk Dude)
      if (customer.active) {
        // Red Pulsing Ring
        const pulse = Math.sin(waveTick * 2) * 4;
        ctx.strokeStyle = "#ff1a1a";
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(customer.x, customer.y, customer.r + pulse, 0, Math.PI * 2);
        ctx.stroke();

        // Customer Figure
        drawPassengerFigure(customer.x, customer.y, Math.sin(waveTick * 3) > 0);

        // Floating Red "$" Coin
        const bob = Math.sin(waveTick * 3) * 6;
        drawDollarBadge(customer.x, customer.y - 32 + bob);
      }

      // F. Draw Destination Drop-Off
      if (dropoff.active) {
        ctx.fillStyle = "rgba(0, 255, 100, 0.25)";
        ctx.strokeStyle = "#00ff66";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(dropoff.x, dropoff.y, dropoff.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px Impact";
        ctx.fillText("STOP HERE", dropoff.x - 30, dropoff.y + 5);
      }

      // G. Crazy Taxi Yellow Convertible
      ctx.save();
      ctx.translate(car.x, car.y);
      ctx.rotate(car.angle);

      // Taxi Shadow
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.fillRect(-22, -10, 48, 28);

      // Wheels
      ctx.fillStyle = "#111";
      ctx.fillRect(-18, -16, 10, 5);
      ctx.fillRect(10, -16, 10, 5);
      ctx.fillRect(-18, 11, 10, 5);
      ctx.fillRect(10, 11, 10, 5);

      // Yellow Body
      ctx.fillStyle = "#ffcc00";
      ctx.fillRect(-24, -13, 48, 26);

      // Red Interior / Seats
      ctx.fillStyle = "#c00";
      ctx.fillRect(-10, -9, 18, 18);

      // Driver
      ctx.fillStyle = "#ffcc99";
      ctx.beginPath();
      ctx.arc(-2, 0, 4, 0, Math.PI * 2);
      ctx.fill();

      // Windshield
      ctx.fillStyle = "#e0f7fa";
      ctx.fillRect(8, -10, 4, 20);

      // Taxi Checker Roof Decal
      ctx.fillStyle = "#000";
      ctx.fillRect(-20, -13, 4, 26);
      ctx.restore();

      // H. Crazy Taxi Signature Guide Arrow (Top Center)
      const target = hasPassenger ? dropoff : customer;
      if (target.active) {
        drawGuideArrow(target.x, target.y);
      }

      requestAnimationFrame(gameLoop);
    }

    // Helper: Sidewalk Checker Pattern
    function drawSidewalk(x, y, w, h) {
      ctx.fillStyle = "#dcd6c8";
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = "#b5ad9e";
      ctx.lineWidth = 1;
      const size = 18;
      for (let px = x; px < x + w; px += size) {
        for (let py = y; py < y + h; py += size) {
          ctx.strokeRect(px, py, size, size);
        }
      }
      // Sidewalk Curb Line
      ctx.fillStyle = "#8a857b";
      ctx.fillRect(x, y + h - 5, w, 5);
    }

    // Helper: Red Brick Building
    function drawBuilding(x, y, w, h) {
      ctx.fillStyle = "#b22222";
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = "#800000";
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);

      // Windows
      ctx.fillStyle = "#87ceeb";
      for (let wx = x + 12; wx < x + w - 15; wx += 24) {
        ctx.fillRect(wx, y + 15, 14, 20);
        ctx.fillRect(wx, y + 45, 14, 20);
      }
    }

    // Helper: Passenger Stick Figure
    function drawPassengerFigure(x, y, armsUp) {
      // Head
      ctx.fillStyle = "#ffcc99";
      ctx.beginPath();
      ctx.arc(x, y - 10, 5, 0, Math.PI * 2);
      ctx.fill();

      // Blue Shirt Body
      ctx.fillStyle = "#0066cc";
      ctx.fillRect(x - 4, y - 5, 8, 12);

      // Waving Arms
      ctx.strokeStyle = "#0066cc";
      ctx.lineWidth = 3;
      ctx.beginPath();
      if (armsUp) {
        ctx.moveTo(x - 4, y - 2); ctx.lineTo(x - 9, y - 12);
        ctx.moveTo(x + 4, y - 2); ctx.lineTo(x + 9, y - 12);
      } else {
        ctx.moveTo(x - 4, y - 2); ctx.lineTo(x - 9, y);
        ctx.moveTo(x + 4, y - 2); ctx.lineTo(x + 9, y);
      }
      ctx.stroke();

      // Pants
      ctx.fillStyle = "#222";
      ctx.fillRect(x - 4, y + 7, 3, 7);
      ctx.fillRect(x + 1, y + 7, 3, 7);
    }

    // Helper: Red "$" Badge
    function drawDollarBadge(x, y) {
      ctx.fillStyle = "#cc0000";
      ctx.beginPath();
      ctx.arc(x, y, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 13px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("$", x, y + 1);
    }

    // Helper: 3D-Style Green Compass Arrow
    function drawGuideArrow(tx, ty) {
      const angle = Math.atan2(ty - car.y, tx - car.x);
      const cx = canvas.width / 2;
      const cy = 60;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);

      ctx.fillStyle = "#00ff33";
      ctx.strokeStyle = "#005500";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(25, 0);
      ctx.lineTo(-15, -12);
      ctx.lineTo(-8, 0);
      ctx.lineTo(-15, 12);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    gameLoop();
  </script>
</body>
</html>
