<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crazy Taxi 2D Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #999; color: #fff; font-family: "Impact", "Arial Black", sans-serif; overflow: hidden; touch-action: none; }

    /* Crazy Taxi Retro Arcade HUD */
    #hud {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 10;
    }

    /* Top-Left Flame Countdown Timer */
    #timer-box {
      background: #000; border: 3px solid #ffcc00; border-radius: 6px;
      padding: 4px 10px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
    #timer-val {
      font-size: 32px; color: #ff1a00;
      text-shadow: 2px 2px 0 #ffe600, -1px -1px 0 #000;
      letter-spacing: 2px;
    }
    #timer-sub { font-size: 10px; color: #ffcc00; letter-spacing: 1px; }

    /* Top-Right Yellow Roller Fare Meter */
    #meter-box {
      background: #ffcc00; border: 3px solid #b8860b; border-radius: 6px;
      padding: 4px 8px; text-align: right; box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
    .roller-line {
      background: #111; color: #00ff66; font-family: "Courier New", monospace;
      font-weight: 900; font-size: 16px; padding: 2px 6px; border-radius: 3px;
      letter-spacing: 2px; margin-bottom: 2px; border: 1px solid #333;
    }
    .roller-label { font-size: 9px; color: #333; font-weight: bold; }

    /* Bottom-Right D/R Gear Box */
    #gear-box {
      position: absolute; bottom: 105px; right: 20px;
      background: #ffcc00; border: 3px solid #333; border-radius: 6px;
      padding: 4px 8px; text-align: center; font-size: 18px; font-weight: 900;
      color: #111; z-index: 10; pointer-events: none;
    }
    .gear-active { background: #ff2200; color: #fff; padding: 2px 6px; border-radius: 4px; }

    canvas { display: block; width: 100vw; height: 100vh; }

    /* Mobile Controls */
    .touch-controls {
      position: absolute; bottom: 20px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 20px;
      pointer-events: none; z-index: 20;
    }
    .btn-group { display: flex; gap: 12px; pointer-events: auto; }
    .t-btn {
      width: 68px; height: 68px; border-radius: 50%; border: 3px solid #ffcc00;
      background: rgba(0, 0, 0, 0.7); color: #fff; font-size: 26px; font-weight: bold;
      display: flex; align-items: center; justify-content: center; touch-action: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }
    .t-btn:active { background: #ffcc00; color: #000; }
    .pedal-gas { background: rgba(0, 180, 50, 0.7); border-color: #00ff66; }
    .pedal-brake { background: rgba(220, 30, 30, 0.7); border-color: #ff3333; }
  </style>
</head>
<body>

  <div id="hud">
    <div id="timer-box">
      <div id="timer-val">45"00</div>
      <div id="timer-sub">TIME LIMIT</div>
    </div>

    <div id="meter-box">
      <div class="roller-label">FARE</div>
      <div class="roller-line" id="fare-val">$000.00</div>
      <div class="roller-label">TOTAL EARNED</div>
      <div class="roller-line" id="total-val">$000.00</div>
    </div>
  </div>

  <div id="gear-box">
    <span id="gear-d" class="gear-active">D</span> | <span id="gear-r">R</span>
  </div>

  <canvas id="game"></canvas>

  <div class="touch-controls">
    <div class="btn-group">
      <div class="t-btn" id="btn-left">◀</div>
      <div class="t-btn" id="btn-right">▶</div>
    </div>
    <div class="btn-group">
      <div class="t-btn pedal-brake" id="btn-brake">R</div>
      <div class="t-btn pedal-gas" id="btn-gas">GAS</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const timerVal = document.getElementById("timer-val");
    const fareVal = document.getElementById("fare-val");
    const totalVal = document.getElementById("total-val");
    const gearD = document.getElementById("gear-d");
    const gearR = document.getElementById("gear-r");

    // CITY GRID DIMENSIONS
    const BLOCK_W = 600;
    const BLOCK_H = 600;
    const ROAD_W = 220;
    const SIDEWALK_W = 65;    // Accessible footpath (65px wide on all sides)
    const CELL_W = BLOCK_W + ROAD_W;
    const CELL_H = BLOCK_H + ROAD_W;
    const GRID_COLS = 5;
    const GRID_ROWS = 5;
    const WORLD_W = GRID_COLS * CELL_W;
    const WORLD_H = GRID_ROWS * CELL_H;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // Audio FX
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }
    function playBeep(freq, type = "sine", duration = 0.15) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playCrashThud() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(130, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.16);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.16);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.16);
    }

    // Spark Particles for building impacts
    const sparks = [];
    function createSparks(x, y) {
      for (let i = 0; i < 9; i++) {
        sparks.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 7,
          vy: (Math.random() - 0.5) * 7,
          life: 1.0,
          color: Math.random() > 0.4 ? "#ffdd00" : "#ff3300"
        });
      }
    }

    // Game Variables
    let totalScore = 0;
    let currentFare = 0;
    let timeLeft = 45.0;
    let hasPassenger = false;
    let waveTick = 0;

    // Taxi Player
    const car = {
      x: CELL_W * 1.5 + ROAD_W / 4,
      y: CELL_H * 1.5 + ROAD_W / 2,
      speed: 0, angle: -Math.PI / 2,
      radius: 17, // Collision radius for taxi bumper
      maxSpeed: 7.2, accel: 0.28, friction: 0.94, turnSpeed: 0.072
    };

    const camera = { x: 0, y: 0 };

    // Passenger initially on the sidewalk corner
    let customer = {
      x: CELL_W * 1 + ROAD_W + 32,
      y: CELL_H * 1 + ROAD_W + 32,
      r: 48, active: true
    };
    let dropoff = { x: 0, y: 0, r: 52, active: false };

    // Inputs
    const keys = { left: false, right: false, gas: false, brake: false };
    window.addEventListener("keydown", (e) => {
      initAudio();
      if (e.key === "a" || e.key === "ArrowLeft") keys.left = true;
      if (e.key === "d" || e.key === "ArrowRight") keys.right = true;
      if (e.key === "w" || e.key === "ArrowUp") keys.gas = true;
      if (e.key === "s" || e.key === "ArrowDown") keys.brake = true;
    });
    window.addEventListener("keyup", (e) => {
      if (e.key === "a" || e.key === "ArrowLeft") keys.left = false;
      if (e.key === "d" || e.key === "ArrowRight") keys.right = false;
      if (e.key === "w" || e.key === "ArrowUp") keys.gas = false;
      if (e.key === "s" || e.key === "ArrowDown") keys.brake = false;
    });

    function bindTouch(id, action) {
      const el = document.getElementById(id);
      el.addEventListener("touchstart", (e) => { e.preventDefault(); initAudio(); keys[action] = true; });
      el.addEventListener("touchend", (e) => { e.preventDefault(); keys[action] = false; });
    }
    bindTouch("btn-left", "left");
    bindTouch("btn-right", "right");
    bindTouch("btn-gas", "gas");
    bindTouch("btn-brake", "brake");

    function formatNumber(num) {
      return num.toFixed(2).padStart(6, "0");
    }

    // Pick random destination on sidewalk/footpath (always accessible)
    function getRandomSidewalkSpot() {
      const col = Math.floor(Math.random() * (GRID_COLS - 1));
      const row = Math.floor(Math.random() * (GRID_ROWS - 1));
      const bx = col * CELL_W + ROAD_W;
      const by = row * CELL_H + ROAD_W;

      const corner = Math.floor(Math.random() * 4);
      let sx = bx + 32, sy = by + 32;
      if (corner === 1) { sx = bx + BLOCK_W - 32; sy = by + 32; }
      else if (corner === 2) { sx = bx + 32; sy = by + BLOCK_H - 32; }
      else if (corner === 3) { sx = bx + BLOCK_W - 32; sy = by + BLOCK_H - 32; }

      return { x: sx, y: sy };
    }

    // RESOLVE BUILDING COLLISION
    // Roads & Footpaths (sidewalks) are walkable/drivable. Only the central building core is solid!
    function resolveBuildingCollisions() {
      const cMin = Math.max(0, Math.floor((car.x - 120) / CELL_W));
      const cMax = Math.min(GRID_COLS - 1, Math.floor((car.x + 120) / CELL_W));
      const rMin = Math.max(0, Math.floor((car.y - 120) / CELL_H));
      const rMax = Math.min(GRID_ROWS - 1, Math.floor((car.y + 120) / CELL_H));

      for (let c = cMin; c <= cMax; c++) {
        for (let r = rMin; r <= rMax; r++) {
          const bx = c * CELL_W + ROAD_W;
          const by = r * CELL_H + ROAD_W;
          // The building sits inside the block, recessed by the sidewalk footpath
          const bX = bx + SIDEWALK_W;
          const bY = by + SIDEWALK_W;
          const bW = BLOCK_W - SIDEWALK_W * 2;
          const bH = BLOCK_H - SIDEWALK_W * 2;

          // Find closest point on building rectangle to car bumper
          const closestX = Math.max(bX, Math.min(car.x, bX + bW));
          const closestY = Math.max(bY, Math.min(car.y, bY + bH));
          let dx = car.x - closestX;
          let dy = car.y - closestY;
          let distSq = dx * dx + dy * dy;

          if (distSq < car.radius * car.radius) {
            let dist = Math.sqrt(distSq);

            // Handle car deeply trapped inside building wall
            if (dist === 0) {
              const dLeft = car.x - bX;
              const dRight = (bX + bW) - car.x;
              const dTop = car.y - bY;
              const dBottom = (bY + bH) - car.y;
              const minD = Math.min(dLeft, dRight, dTop, dBottom);
              if (minD === dLeft) dx = -1;
              else if (minD === dRight) dx = 1;
              else if (minD === dTop) dy = -1;
              else dy = 1;
              dist = 1;
            }

            // Push car out of the building back onto the sidewalk
            const overlap = car.radius - dist;
            car.x += (dx / dist) * overlap;
            car.y += (dy / dist) * overlap;

            // Audio & visual collision impact
            if (Math.abs(car.speed) > 1.2) {
              playCrashThud();
              createSparks(closestX, closestY);
            }
            car.speed = -car.speed * 0.3; // Rebound bounce
          }
        }
      }
    }

    function gameLoop() {
      // 1. Timer
      if (timeLeft > 0) {
        timeLeft -= 1 / 60;
        const sec = Math.floor(timeLeft);
        const ms = Math.floor((timeLeft % 1) * 100);
        timerVal.innerText = `${sec.toString().padStart(2, "0")}'${ms.toString().padStart(2, "0")}`;
      } else {
        timerVal.innerText = "00'00";
      }

      // 2. Car Dynamics
      if (Math.abs(car.speed) > 0.4) {
        const dir = car.speed >= 0 ? 1 : -1;
        if (keys.left) car.angle -= car.turnSpeed * dir;
        if (keys.right) car.angle += car.turnSpeed * dir;
      }

      if (keys.gas) {
        car.speed = Math.min(car.speed + car.accel, car.maxSpeed);
      } else if (keys.brake) {
        car.speed = Math.max(car.speed - car.accel * 1.2, -car.maxSpeed * 0.45);
      } else {
        car.speed *= car.friction;
      }

      // Gear HUD
      if (car.speed < -0.2) {
        gearD.className = ""; gearR.className = "gear-active";
      } else {
        gearD.className = "gear-active"; gearR.className = "";
      }

      // Move car
      car.x += Math.cos(car.angle) * car.speed;
      car.y += Math.sin(car.angle) * car.speed;

      // Solid Building Collision (blocks buildings, leaves road & sidewalk open)
      resolveBuildingCollisions();

      // Screen/World boundaries
      car.x = Math.max(40, Math.min(WORLD_W - 40, car.x));
      car.y = Math.max(40, Math.min(WORLD_H - 40, car.y));

      // Camera Centering
      camera.x = car.x - canvas.width / 2;
      camera.y = car.y - canvas.height / 2;

      const isStopped = Math.abs(car.speed) < 0.4;
      waveTick += 0.08;

      // 3. Pickup Logic
      if (!hasPassenger && customer.active) {
        const d = Math.hypot(car.x - customer.x, car.y - customer.y);
        if (d < customer.r && isStopped) {
          hasPassenger = true;
          customer.active = false;
          const spot = getRandomSidewalkSpot();
          dropoff.x = spot.x;
          dropoff.y = spot.y;
          dropoff.active = true;
          timeLeft += 20.0;
          currentFare = 60.00;
          fareVal.innerText = "$" + formatNumber(currentFare);
          playBeep(520, "triangle", 0.2);
          playBeep(780, "sine", 0.3);
        }
      }

      // 4. Dropoff Logic
      if (hasPassenger && dropoff.active) {
        const d = Math.hypot(car.x - dropoff.x, car.y - dropoff.y);
        if (d < dropoff.r && isStopped) {
          hasPassenger = false;
          dropoff.active = false;
          totalScore += currentFare;
          totalVal.innerText = "$" + formatNumber(totalScore);
          currentFare = 0;
          fareVal.innerText = "$000.00";
          playBeep(660, "sine", 0.15);
          playBeep(990, "triangle", 0.4);

          setTimeout(() => {
            const spot = getRandomSidewalkSpot();
            customer.x = spot.x;
            customer.y = spot.y;
            customer.active = true;
          }, 1200);
        }
      }

      // 5. RENDER CITY
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(-camera.x, -camera.y);

      // BASE ROAD: Light textured asphalt
      ctx.fillStyle = "#9c9c9c";
      ctx.fillRect(camera.x, camera.y, canvas.width, canvas.height);

      for (let c = 0; c < GRID_COLS; c++) {
        for (let r = 0; r < GRID_ROWS; r++) {
          const bx = c * CELL_W + ROAD_W;
          const by = r * CELL_H + ROAD_W;

          if (bx + BLOCK_W < camera.x - 100 || bx > camera.x + canvas.width + 100 ||
              by + BLOCK_H < camera.y - 100 || by > camera.y + canvas.height + 100) {
            continue;
          }

          // A. Road Markings
          drawRoadMarkings(c * CELL_W, r * CELL_H);

          // B. Footpath / Sidewalk (drivable surface)
          drawSidewalkBlock(bx, by, BLOCK_W, BLOCK_H);

          // C. Red Brick Building (solid obstacle)
          drawRedBuilding(bx + SIDEWALK_W, by + SIDEWALK_W, BLOCK_W - SIDEWALK_W * 2, BLOCK_H - SIDEWALK_W * 2);

          // D. Sidewalk Props
          drawStreetProps(bx, by);
        }
      }

      // 6. Draw Customer on Footpath
      if (customer.active) {
        const pulse = Math.sin(waveTick * 2) * 5;
        ctx.strokeStyle = "#e60000";
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.ellipse(customer.x, customer.y, customer.r + pulse, (customer.r + pulse) * 0.75, 0, 0, Math.PI * 2);
        ctx.stroke();

        drawWavingCustomer(customer.x, customer.y, Math.sin(waveTick * 3) > 0);
        drawRedDollarCoin(customer.x, customer.y - 36 + Math.sin(waveTick * 3) * 6);
      }

      // 7. Draw Destination Target
      if (dropoff.active) {
        ctx.fillStyle = "rgba(0, 255, 100, 0.25)";
        ctx.strokeStyle = "#00ff66";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(dropoff.x, dropoff.y, dropoff.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 16px Impact";
        ctx.fillText("STOP HERE", dropoff.x - 35, dropoff.y + 6);
      }

      // 8. Draw Sparks from building collisions
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx;
        s.y += s.vy;
        s.life -= 0.06;
        if (s.life <= 0) {
          sparks.splice(i, 1);
          continue;
        }
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, 3 * s.life, 0, Math.PI * 2);
        ctx.fill();
      }

      // 9. Draw Taxi
      ctx.save();
      ctx.translate(car.x, car.y);
      ctx.rotate(car.angle);

      // Shadow
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.fillRect(-22, -10, 48, 28);

      // Wheels
      ctx.fillStyle = "#1a1a1a";
      ctx.fillRect(-18, -16, 10, 5);
      ctx.fillRect(10, -16, 10, 5);
      ctx.fillRect(-18, 11, 10, 5);
      ctx.fillRect(10, 11, 10, 5);

      // Yellow Car Body
      ctx.fillStyle = "#ffcc00";
      ctx.fillRect(-24, -13, 48, 26);

      // Red Seats
      ctx.fillStyle = "#cc0000";
      ctx.fillRect(-10, -9, 18, 18);

      // Driver
      ctx.fillStyle = "#ffeb3b";
      ctx.beginPath(); ctx.arc(-2, 0, 4.5, 0, Math.PI * 2); ctx.fill();

      // Windshield
      ctx.fillStyle = "#cceeff";
      ctx.fillRect(8, -10, 4, 20);

      // Decal
      ctx.fillStyle = "#000";
      ctx.fillRect(-22, -13, 3, 26);

      ctx.restore();
      ctx.restore(); // Restore camera offset

      // 10. SCREEN-SPACE HUD: Crazy Taxi Guide Arrow
      const target = hasPassenger ? dropoff : customer;
      if (target.active) {
        drawGuideArrow(target.x, target.y);
      }

      requestAnimationFrame(gameLoop);
    }

    // --- ART BUILDERS ---

    function drawSidewalkBlock(x, y, w, h) {
      // Curb Drop Shadow
      ctx.fillStyle = "#7a7a7a";
      ctx.fillRect(x - 6, y - 6, w + 12, h + 12);

      // Terracotta Curb Rim
      ctx.fillStyle = "#d58977";
      ctx.fillRect(x - 4, y - 4, w + 8, h + 8);

      // Checkered Sidewalk Surface (Footpath)
      ctx.fillStyle = "#eae5dc";
      ctx.fillRect(x, y, w, h);

      // Checkered Grid
      ctx.strokeStyle = "#d6cfc2";
      ctx.lineWidth = 1;
      const tSize = 16;
      for (let tx = x; tx < x + w; tx += tSize) {
        ctx.beginPath(); ctx.moveTo(tx, y); ctx.lineTo(tx, y + h); ctx.stroke();
      }
      for (let ty = y; ty < y + h; ty += tSize) {
        ctx.beginPath(); ctx.moveTo(x, ty); ctx.lineTo(x + w, ty); ctx.stroke();
      }

      // Cut 45-degree corner angles to display street below
      ctx.fillStyle = "#9c9c9c";
      ctx.beginPath();
      ctx.moveTo(x - 5, y - 5); ctx.lineTo(x + 22, y - 5); ctx.lineTo(x - 5, y + 22); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + w + 5, y - 5); ctx.lineTo(x + w - 22, y - 5); ctx.lineTo(x + w + 5, y + 22); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x - 5, y + h + 5); ctx.lineTo(x + 22, y + h + 5); ctx.lineTo(x - 5, y + h - 22); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + w + 5, y + h + 5); ctx.lineTo(x + w - 22, y + h + 5); ctx.lineTo(x + w + 5, y + h - 22); ctx.fill();

      // Curb border line
      ctx.strokeStyle = "#d58977";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x + 22, y - 4); ctx.lineTo(x - 4, y + 22);
      ctx.moveTo(x + w - 22, y - 4); ctx.lineTo(x + w + 4, y + 22);
      ctx.moveTo(x + 22, y + h + 4); ctx.lineTo(x - 4, y + h - 22);
      ctx.moveTo(x + w - 22, y + h + 4); ctx.lineTo(x + w + 4, y + h - 22);
      ctx.stroke();
    }

    function drawRedBuilding(x, y, w, h) {
      // Building drop shadow on sidewalk
      ctx.fillStyle = "rgba(0,0,0,0.2)";
      ctx.fillRect(x + 8, y + 8, w, h);

      // Red Brick Facade
      ctx.fillStyle = "#c92a2a";
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = "#8f1d1d";
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, w, h);

      // Windows
      ctx.fillStyle = "#5dade2";
      const winW = 18;
      const winH = 26;
      for (let wx = x + 16; wx < x + w - 20; wx += 30) {
        for (let wy = y + 16; wy < y + h - 25; wy += 38) {
          ctx.fillRect(wx, wy, winW, winH);
          ctx.fillStyle = "rgba(255,255,255,0.45)";
          ctx.fillRect(wx + 2, wy + 2, 4, winH - 4);
          ctx.fillStyle = "#5dade2";
        }
      }
    }

    function drawRoadMarkings(rx, ry) {
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 4;
      ctx.setLineDash([20, 20]);

      ctx.beginPath();
      ctx.moveTo(rx, ry + ROAD_W / 2);
      ctx.lineTo(rx + CELL_W, ry + ROAD_W / 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(rx + ROAD_W / 2, ry);
      ctx.lineTo(rx + ROAD_W / 2, ry + CELL_H);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.font = "bold 20px Arial";
      ctx.save();
      ctx.translate(rx + ROAD_W / 2 + 30, ry + ROAD_W + 45);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText("STOP", 0, 0);
      ctx.restore();
    }

    function drawStreetProps(bx, by) {
      const px = bx + 28;
      const py = by + 28;
      ctx.fillStyle = "#d90429";
      ctx.fillRect(px, py, 20, 28);
      ctx.fillStyle = "#bde0fe";
      ctx.fillRect(px + 3, py + 3, 14, 22);
      ctx.fillStyle = "#d90429";
      ctx.fillRect(px + 8, py + 3, 4, 22);

      const lx = bx + BLOCK_W - 32;
      const ly = by + 32;
      ctx.fillStyle = "#588157";
      ctx.beginPath(); ctx.arc(lx, ly, 14, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = "#ff0055";
      ctx.fillRect(lx - 8, ly - 4, 3, 3);
      ctx.fillRect(lx + 6, ly + 2, 3, 3);
      ctx.fillStyle = "#ffcc00";
      ctx.fillRect(lx - 2, ly + 6, 3, 3);
      ctx.fillRect(lx + 4, ly - 6, 3, 3);

      ctx.fillStyle = "#2d6a4f";
      ctx.beginPath(); ctx.arc(lx, ly, 5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#2d6a4f";
      ctx.lineWidth = 3;
      ctx.strokeRect(lx - 6, ly - 6, 12, 12);
    }

    function drawWavingCustomer(x, y, armsUp) {
      ctx.fillStyle = "#ffcc99";
      ctx.beginPath(); ctx.arc(x, y - 10, 5.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#0066cc";
      ctx.fillRect(x - 5, y - 4, 10, 13);
      ctx.strokeStyle = "#0066cc";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      if (armsUp) {
        ctx.moveTo(x - 5, y - 1); ctx.lineTo(x - 11, y - 12);
        ctx.moveTo(x + 5, y - 1); ctx.lineTo(x + 11, y - 12);
      } else {
        ctx.moveTo(x - 5, y - 1); ctx.lineTo(x - 11, y + 2);
        ctx.moveTo(x + 5, y - 1); ctx.lineTo(x + 11, y + 2);
      }
      ctx.stroke();
      ctx.fillStyle = "#2b2d42";
      ctx.fillRect(x - 4, y + 9, 3, 7);
      ctx.fillRect(x + 1, y + 9, 3, 7);
    }

    function drawRedDollarCoin(x, y) {
      ctx.fillStyle = "#cc0000";
      ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 15px Arial";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("$", x, y + 1);
    }

    function drawGuideArrow(tx, ty) {
      const angle = Math.atan2(ty - car.y, tx - car.x);
      const cx = canvas.width / 2;
      const cy = 60;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);

      ctx.fillStyle = "#00ff33";
      ctx.strokeStyle = "#005500";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(28, 0);
      ctx.lineTo(-18, -14);
      ctx.lineTo(-10, 0);
      ctx.lineTo(-18, 14);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    gameLoop();
  </script>
</body>
</html>
