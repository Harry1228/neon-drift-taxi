<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crazy Taxi: Open World Tour</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #111; color: #fff; font-family: "Impact", "Arial Black", sans-serif; overflow: hidden; touch-action: none; }

    /* Crazy Taxi Arcade HUD */
    #hud {
      position: absolute; top: 10px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 10;
    }
    
    #timer-box {
      background: #000; border: 3px solid #ffcc00; border-radius: 6px;
      padding: 4px 10px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
    #timer-val {
      font-size: 30px; color: #ff2200; text-shadow: 2px 2px 0 #ffe600, -1px -1px 0 #000;
      letter-spacing: 2px;
    }
    #timer-sub { font-size: 10px; color: #ffcc00; letter-spacing: 1px; }

    #meter-box {
      background: #ffcc00; border: 3px solid #b8860b; border-radius: 6px;
      padding: 4px 8px; text-align: right; box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
    .roller-line {
      background: #111; color: #00ff66; font-family: "Courier New", monospace;
      font-weight: 900; font-size: 16px; padding: 2px 6px; border-radius: 3px;
      letter-spacing: 2px; margin-bottom: 2px; border: 1px solid #333;
    }
    .roller-label { font-size: 9px; color: #333; font-weight: bold; }

    /* District Notification Banner */
    #district-banner {
      position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85); border: 2px solid #ffcc00; color: #ffcc00;
      padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: bold;
      letter-spacing: 1px; pointer-events: none; z-index: 10; transition: opacity 0.5s;
    }

    #gear-box {
      position: absolute; bottom: 105px; right: 20px;
      background: #ffcc00; border: 3px solid #333; border-radius: 6px;
      padding: 4px 8px; text-align: center; font-size: 18px; font-weight: 900;
      color: #111; z-index: 10; pointer-events: none;
    }
    .gear-active { background: #ff2200; color: #fff; padding: 2px 6px; border-radius: 4px; }

    canvas { display: block; width: 100vw; height: 100vh; }

    /* Mobile Touch Pedals & Steering */
    .touch-controls {
      position: absolute; bottom: 20px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 20px;
      pointer-events: none; z-index: 20;
    }
    .btn-group { display: flex; gap: 12px; pointer-events: auto; }
    .t-btn {
      width: 68px; height: 68px; border-radius: 50%; border: 3px solid #ffcc00;
      background: rgba(0, 0, 0, 0.65); color: #fff; font-size: 26px; font-weight: bold;
      display: flex; align-items: center; justify-content: center; touch-action: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }
    .t-btn:active { background: #ffcc00; color: #000; }
    .pedal-gas { background: rgba(0, 180, 0, 0.6); border-color: #00ff66; }
    .pedal-brake { background: rgba(200, 0, 0, 0.6); border-color: #ff3333; }
  </style>
</head>
<body>

  <div id="hud">
    <div id="timer-box">
      <div id="timer-val">60"00</div>
      <div id="timer-sub">TIME LIMIT</div>
    </div>

    <div id="meter-box">
      <div class="roller-label">FARE</div>
      <div class="roller-line" id="fare-val">$000.00</div>
      <div class="roller-label">TOTAL EARNED</div>
      <div class="roller-line" id="total-val">$000.00</div>
    </div>
  </div>

  <div id="district-banner">DOWNTOWN METRO</div>

  <div id="gear-box">
    <span id="gear-d" class="gear-active">D</span> | <span id="gear-r">R</span>
  </div>

  <canvas id="game"></canvas>

  <div class="touch-controls">
    <div class="btn-group">
      <div class="t-btn" id="btn-left">◀</div>
      <div class="t-btn" id="btn-right">▶</div>
    </div>
    <div class="btn-group">
      <div class="t-btn pedal-brake" id="btn-brake">R</div>
      <div class="t-btn pedal-gas" id="btn-gas">GAS</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const timerVal = document.getElementById("timer-val");
    const fareVal = document.getElementById("fare-val");
    const totalVal = document.getElementById("total-val");
    const districtBanner = document.getElementById("district-banner");
    const gearD = document.getElementById("gear-d");
    const gearR = document.getElementById("gear-r");

    // HUGE OPEN WORLD BOUNDARIES
    const WORLD_W = 2400;
    const WORLD_H = 4800; // Long vertical journey

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // Sound FX Generator
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }
    function playBeep(freq, type = "sine", duration = 0.15) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Game State
    let totalScore = 0;
    let currentFare = 0;
    let timeLeft = 60.0;
    let hasPassenger = false;
    let waveTick = 0;
    let currentDistrict = "";

    // Taxi player stats (starts at bottom Downtown area)
    const car = {
      x: WORLD_W / 2, y: WORLD_H - 400,
      speed: 0, angle: -Math.PI / 2,
      maxSpeed: 8.5, accel: 0.32, friction: 0.94, turnSpeed: 0.075
    };

    // Camera viewport coordinates
    const camera = { x: 0, y: 0 };

    // Dynamic Destinations across different world zones
    let customer = { x: WORLD_W / 2 - 150, y: WORLD_H - 600, r: 60, active: true };
    let dropoff = { x: WORLD_W / 2 + 150, y: 800, r: 60, active: false };

    // Key & Touch Inputs
    const keys = { left: false, right: false, gas: false, brake: false };

    window.addEventListener("keydown", (e) => {
      initAudio();
      if (e.key === "a" || e.key === "ArrowLeft") keys.left = true;
      if (e.key === "d" || e.key === "ArrowRight") keys.right = true;
      if (e.key === "w" || e.key === "ArrowUp") keys.gas = true;
      if (e.key === "s" || e.key === "ArrowDown") keys.brake = true;
    });
    window.addEventListener("keyup", (e) => {
      if (e.key === "a" || e.key === "ArrowLeft") keys.left = false;
      if (e.key === "d" || e.key === "ArrowRight") keys.right = false;
      if (e.key === "w" || e.key === "ArrowUp") keys.gas = false;
      if (e.key === "s" || e.key === "ArrowDown") keys.brake = false;
    });

    function bindTouch(id, action) {
      const el = document.getElementById(id);
      el.addEventListener("touchstart", (e) => { e.preventDefault(); initAudio(); keys[action] = true; });
      el.addEventListener("touchend", (e) => { e.preventDefault(); keys[action] = false; });
    }
    bindTouch("btn-left", "left");
    bindTouch("btn-right", "right");
    bindTouch("btn-gas", "gas");
    bindTouch("btn-brake", "brake");

    function formatNumber(num) {
      return num.toFixed(2).padStart(6, "0");
    }

    // Random location generator ensuring long trips between zones
    function getFarLocation(currentY) {
      const x = Math.random() * (WORLD_W - 600) + 300;
      let y;
      // If player is south (Downtown), send them north (Beach/Suburbs) and vice-versa
      if (currentY > WORLD_H / 2) {
        y = Math.random() * (WORLD_H * 0.45) + 200; // North zone
      } else {
        y = Math.random() * (WORLD_H * 0.45) + (WORLD_H * 0.5); // South zone
      }
      return { x, y };
    }

    function gameLoop() {
      // 1. Timer Countdown
      if (timeLeft > 0) {
        timeLeft -= 1 / 60;
        const sec = Math.floor(timeLeft);
        const ms = Math.floor((timeLeft % 1) * 100);
        timerVal.innerText = `${sec.toString().padStart(2, "0")}'${ms.toString().padStart(2, "0")}`;
      } else {
        timerVal.innerText = "00'00";
      }

      // 2. Car Dynamics
      if (Math.abs(car.speed) > 0.4) {
        const dir = car.speed >= 0 ? 1 : -1;
        if (keys.left) car.angle -= car.turnSpeed * dir;
        if (keys.right) car.angle += car.turnSpeed * dir;
      }

      if (keys.gas) {
        car.speed = Math.min(car.speed + car.accel, car.maxSpeed);
      } else if (keys.brake) {
        car.speed = Math.max(car.speed - car.accel * 1.2, -car.maxSpeed * 0.45);
      } else {
        car.speed *= car.friction;
      }

      // Gear Display
      if (car.speed < -0.2) {
        gearD.className = ""; gearR.className = "gear-active";
      } else {
        gearD.className = "gear-active"; gearR.className = "";
      }

      car.x += Math.cos(car.angle) * car.speed;
      car.y += Math.sin(car.angle) * car.speed;

      // Keep inside World map boundaries
      car.x = Math.max(60, Math.min(WORLD_W - 60, car.x));
      car.y = Math.max(60, Math.min(WORLD_H - 60, car.y));

      // 3. Smooth Camera Follow
      camera.x = car.x - canvas.width / 2;
      camera.y = car.y - canvas.height / 2;

      // 4. District Banner Check
      let newDistrict = "";
      if (car.y > 3200) newDistrict = "ZONE 1: DOWNTOWN METRO";
      else if (car.y > 1600) newDistrict = "ZONE 2: SUBURBAN GARDENS";
      else newDistrict = "ZONE 3: SUNSET COASTLINE";

      if (newDistrict !== currentDistrict) {
        currentDistrict = newDistrict;
        districtBanner.innerText = currentDistrict;
      }

      const isStopped = Math.abs(car.speed) < 0.4;
      waveTick += 0.08;

      // 5. Pickup Logic
      if (!hasPassenger && customer.active) {
        const d = Math.hypot(car.x - customer.x, car.y - customer.y);
        if (d < customer.r && isStopped) {
          hasPassenger = true;
          customer.active = false;
          const loc = getFarLocation(car.y);
          dropoff.x = loc.x;
          dropoff.y = loc.y;
          dropoff.active = true;
          timeLeft += 35.0; // Extra time for long-distance cruise
          currentFare = 120.00;
          fareVal.innerText = "$" + formatNumber(currentFare);
          playBeep(520, "triangle", 0.2);
          playBeep(780, "sine", 0.3);
        }
      }

      // 6. Dropoff Logic
      if (hasPassenger && dropoff.active) {
        const d = Math.hypot(car.x - dropoff.x, car.y - dropoff.y);
        if (d < dropoff.r && isStopped) {
          hasPassenger = false;
          dropoff.active = false;
          totalScore += currentFare;
          totalVal.innerText = "$" + formatNumber(totalScore);
          currentFare = 0;
          fareVal.innerText = "$000.00";
          playBeep(660, "sine", 0.15);
          playBeep(990, "triangle", 0.4);

          setTimeout(() => {
            const loc = getFarLocation(car.y);
            customer.x = loc.x;
            customer.y = loc.y;
            customer.active = true;
          }, 1200);
        }
      }

      // 7. RENDER THE WORLD (OFFSET BY CAMERA)
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(-camera.x, -camera.y);

      // --- ZONE 3: SUNSET COASTLINE (Y: 0 to 1600) ---
      // Deep Blue Ocean (Left side)
      ctx.fillStyle = "#1e6091";
      ctx.fillRect(0, 0, 500, 1600);
      // Animated Waves
      ctx.strokeStyle = "rgba(255,255,255,0.4)";
      ctx.lineWidth = 3;
      for (let wy = 50; wy < 1600; wy += 90) {
        const waveX = Math.sin(waveTick + wy) * 20 + 440;
        ctx.beginPath();
        ctx.arc(waveX, wy, 40, -Math.PI / 2, Math.PI / 2);
        ctx.stroke();
      }
      // Sandy Beach (Middle)
      ctx.fillStyle = "#f4d06f";
      ctx.fillRect(500, 0, 400, 1600);
      // Coastal Highway (Right side)
      ctx.fillStyle = "#4a4e69";
      ctx.fillRect(900, 0, WORLD_W - 900, 1600);

      // --- ZONE 2: SUBURBAN GARDENS (Y: 1600 to 3200) ---
      // Lush Green Park Grass
      ctx.fillStyle = "#588157";
      ctx.fillRect(0, 1600, WORLD_W, 1600);
      // Suburban Concrete Roads
      ctx.fillStyle = "#6c757d";
      ctx.fillRect(400, 1600, 1600, 1600);
      // Central Park Lake
      ctx.fillStyle = "#3a86ff";
      ctx.beginPath();
      ctx.arc(WORLD_W / 2, 2400, 220, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#a3b18a";
      ctx.lineWidth = 12;
      ctx.stroke();

      // --- ZONE 1: DOWNTOWN METRO (Y: 3200 to WORLD_H) ---
      // Dark City Asphalt
      ctx.fillStyle = "#343a40";
      ctx.fillRect(0, 3200, WORLD_W, WORLD_H - 3200);

      // Draw Checkered Sidewalks & Brick Buildings in Downtown
      for (let by = 3300; by < WORLD_H - 200; by += 350) {
        drawSidewalk(80, by, 350, 120);
        drawBuilding(80, by + 10, 350, 100);
        drawSidewalk(WORLD_W - 450, by, 350, 120);
        drawBuilding(WORLD_W - 450, by + 10, 350, 100);
      }

      // Draw Boulevard Lane Dividers along the central highway
      ctx.strokeStyle = "#ffcc00";
      ctx.lineWidth = 6;
      ctx.setLineDash([35, 25]);
      ctx.beginPath();
      ctx.moveTo(WORLD_W / 2, 0);
      ctx.lineTo(WORLD_W / 2, WORLD_H);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Customer
      if (customer.active) {
        const pulse = Math.sin(waveTick * 2) * 5;
        ctx.strokeStyle = "#ff1a1a";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(customer.x, customer.y, customer.r + pulse, 0, Math.PI * 2);
        ctx.stroke();

        drawPassengerFigure(customer.x, customer.y, Math.sin(waveTick * 3) > 0);
        drawDollarBadge(customer.x, customer.y - 34 + Math.sin(waveTick * 3) * 6);
      }

      // Draw Dropoff Zone
      if (dropoff.active) {
        ctx.fillStyle = "rgba(0, 255, 100, 0.25)";
        ctx.strokeStyle = "#00ff66";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(dropoff.x, dropoff.y, dropoff.r, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px Impact";
        ctx.fillText("DESTINATION", dropoff.x - 45, dropoff.y + 6);
      }

      // Draw Taxi
      ctx.save();
      ctx.translate(car.x, car.y);
      ctx.rotate(car.angle);

      // Shadow
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.fillRect(-22, -10, 48, 28);
      // Wheels
      ctx.fillStyle = "#111";
      ctx.fillRect(-18, -16, 10, 5);
      ctx.fillRect(10, -16, 10, 5);
      ctx.fillRect(-18, 11, 10, 5);
      ctx.fillRect(10, 11, 10, 5);
      // Body
      ctx.fillStyle = "#ffcc00";
      ctx.fillRect(-24, -13, 48, 26);
      // Seats
      ctx.fillStyle = "#c00";
      ctx.fillRect(-10, -9, 18, 18);
      // Driver
      ctx.fillStyle = "#ffcc99";
      ctx.beginPath(); ctx.arc(-2, 0, 4, 0, Math.PI * 2); ctx.fill();
      // Windshield
      ctx.fillStyle = "#e0f7fa";
      ctx.fillRect(8, -10, 4, 20);
      // Roof Decal
      ctx.fillStyle = "#000";
      ctx.fillRect(-20, -13, 4, 26);

      ctx.restore();
      ctx.restore(); // Restore world camera

      // 8. SCREEN-SPACE HUD: Crazy Taxi Guide Arrow
      const target = hasPassenger ? dropoff : customer;
      if (target.active) {
        drawGuideArrow(target.x, target.y);
      }

      requestAnimationFrame(gameLoop);
    }

    // World Helper Functions
    function drawSidewalk(x, y, w, h) {
      ctx.fillStyle = "#dcd6c8";
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = "#b5ad9e";
      ctx.lineWidth = 1;
      for (let px = x; px < x + w; px += 20) {
        for (let py = y; py < y + h; py += 20) {
          ctx.strokeRect(px, py, 20, 20);
        }
      }
    }

    function drawBuilding(x, y, w, h) {
      ctx.fillStyle = "#9b2226";
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = "#590d22";
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, w, h);
    }

    function drawPassengerFigure(x, y, armsUp) {
      ctx.fillStyle = "#ffcc99";
      ctx.beginPath(); ctx.arc(x, y - 10, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#0066cc";
      ctx.fillRect(x - 5, y - 4, 10, 14);
      ctx.strokeStyle = "#0066cc";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      if (armsUp) {
        ctx.moveTo(x - 5, y - 1); ctx.lineTo(x - 11, y - 12);
        ctx.moveTo(x + 5, y - 1); ctx.lineTo(x + 11, y - 12);
      } else {
        ctx.moveTo(x - 5, y - 1); ctx.lineTo(x - 11, y + 2);
        ctx.moveTo(x + 5, y - 1); ctx.lineTo(x + 11, y + 2);
      }
      ctx.stroke();
    }

    function drawDollarBadge(x, y) {
      ctx.fillStyle = "#cc0000";
      ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 14px Arial";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("$", x, y + 1);
    }

    function drawGuideArrow(targetWorldX, targetWorldY) {
      // Calculate angle from taxi to target in world coordinates
      const angle = Math.atan2(targetWorldY - car.y, targetWorldX - car.x);
      const cx = canvas.width / 2;
      const cy = 60;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);

      ctx.fillStyle = "#00ff33";
      ctx.strokeStyle = "#005500";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(28, 0);
      ctx.lineTo(-18, -14);
      ctx.lineTo(-10, 0);
      ctx.lineTo(-18, 14);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    gameLoop();
  </script>
</body>
</html>
