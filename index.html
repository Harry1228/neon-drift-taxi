<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crazy Taxi 3D: Open World Stunt City</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Retro Arcade HUD -->
  <div id="hud">
    <div id="timer-box">
      <div id="timer-val">60"00</div>
      <div id="timer-sub">TIME LIMIT</div>
    </div>

    <div class="hud-center">
      <div id="guide-arrow-container">
        <div id="guide-arrow"></div>
      </div>
      <button id="btn-settings-toggle" onclick="openSettings()">⚙️ CONTROLS</button>
    </div>

    <div id="meter-box">
      <div class="roller-label">FARE</div>
      <div class="roller-line" id="fare-val">$000.00</div>
      <div class="roller-label">TOTAL EARNED</div>
      <div class="roller-line" id="total-val">$000.00</div>
    </div>
  </div>

  <!-- Stunt Popup -->
  <div id="stunt-banner">CRAZY JUMP! +$35</div>

  <div id="gear-box">
    <span id="gear-d" class="gear-active">D</span> | <span id="gear-r">R</span>
  </div>

  <div id="canvas-container"></div>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal">
    <h2>STEERING SETTINGS</h2>
    <div class="setting-option">
      <button class="opt-btn active" id="opt-buttons" onclick="setControlMode('buttons')">
        <span>◀ ▶</span>
        Buttons
      </button>
      <button class="opt-btn" id="opt-wheel" onclick="setControlMode('wheel')">
        <span>🛞</span>
        Steering Wheel
      </button>
    </div>
    <button id="btn-close-settings" onclick="closeSettings()">RESUME GAME</button>
  </div>

  <!-- Mobile Touch Controls -->
  <div class="touch-controls">
    <!-- Left Side: Arrow Buttons OR Steering Wheel -->
    <div class="btn-group" id="btn-group-arrows">
      <div class="t-btn" id="btn-left">◀</div>
      <div class="t-btn" id="btn-right">▶</div>
    </div>

    <div id="wheel-wrapper">
      <div id="wheel">
        <div id="wheel-center">TAXI</div>
      </div>
    </div>

    <!-- Right Side: Pedals + Nitro + Horn -->
    <div class="btn-group">
      <div class="t-btn btn-horn" id="btn-horn">📯</div>
      <div class="t-btn btn-nitro" id="btn-nitro">NOS</div>
      <div class="t-btn pedal-brake" id="btn-brake">R</div>
      <div class="t-btn pedal-gas" id="btn-gas">GAS</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/city.js"></script>
  <script src="js/vehicle.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
