<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Drift Taxi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #0b0d14; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; touch-action: none; }
    #hud {
      position: absolute; top: 12px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 700; font-size: 16px; pointer-events: none; z-index: 10;
    }
    #cash { color: #ffe600; text-shadow: 0 0 10px rgba(255,230,0,0.5); font-size: 20px; }
    #status { color: #00f0ff; text-align: center; }
    #upgrade-btn {
      position: absolute; top: 10px; right: 16px; z-index: 20;
      background: linear-gradient(135deg, #ff0055, #ff5500); color: white;
      border: none; padding: 8px 16px; font-weight: bold; border-radius: 8px;
      cursor: pointer; display: none; box-shadow: 0 4px 15px rgba(255,0,85,0.4);
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    .touch-controls {
      position: absolute; bottom: 24px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 25px;
      pointer-events: none; z-index: 10;
    }
    .btn-group { display: flex; gap: 15px; pointer-events: auto; }
    .t-btn {
      width: 65px; height: 65px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.08); color: white; font-size: 22px; font-weight: bold;
      display: flex; align-items: center; justify-content: center; touch-action: none;
      backdrop-filter: blur(4px);
    }
    .t-btn:active { background: rgba(255,255,255,0.3); border-color: #00f0ff; }
  </style>
</head>
<body>
  <div id="hud">
    <div id="cash">CASH: $0</div>
    <div id="status">Stop inside the CYAN circle!</div>
  </div>
  <button id="upgrade-btn" onclick="buyUpgrade()">Upgrade Engine ($100)</button>

  <canvas id="game"></canvas>

  <div class="touch-controls">
    <div class="btn-group">
      <div class="t-btn" id="btn-left">◀</div>
      <div class="t-btn" id="btn-right">▶</div>
    </div>
    <div class="btn-group">
      <div class="t-btn" id="btn-brake">▼</div>
      <div class="t-btn" id="btn-gas">▲</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const cashLabel = document.getElementById("cash");
    const statusLabel = document.getElementById("status");
    const upgradeBtn = document.getElementById("upgrade-btn");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function playChime(freq1, freq2, duration) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + duration);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playCrash() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(110, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    let wallet = 0;
    let hasPassenger = false;
    let maxSpeed = 5.2;

    const car = {
      x: canvas.width / 2, y: canvas.height / 2,
      speed: 0, angle: 0, turnSpeed: 0.065, accel: 0.22, friction: 0.95
    };

    let pickup = { x: 140, y: 160, r: 42, active: true };
    let dropoff = { x: canvas.width - 140, y: canvas.height - 200, r: 42, active: false };
    const keys = { left: false, right: false, gas: false, brake: false };

    const trafficColors = ["#9d4edd", "#3a86ff", "#00b4d8", "#f72585"];
    const traffic = [
      { x: -50, y: canvas.height * 0.32, speed: 2.6, w: 42, h: 22, color: trafficColors[0], dir: 1 },
      { x: canvas.width + 50, y: canvas.height * 0.44, speed: -3.2, w: 42, h: 22, color: trafficColors[1], dir: -1 },
      { x: -180, y: canvas.height * 0.68, speed: 2.2, w: 42, h: 22, color: trafficColors[2], dir: 1 },
      { x: canvas.width + 120, y: canvas.height * 0.80, speed: -2.8, w: 42, h: 22, color: trafficColors[3], dir: -1 }
    ];

    window.addEventListener("keydown", (e) => {
      initAudio();
      if (e.key === "a" || e.key === "ArrowLeft") keys.left = true;
      if (e.key === "d" || e.key === "ArrowRight") keys.right = true;
      if (e.key === "w" || e.key === "ArrowUp") keys.gas = true;
      if (e.key === "s" || e.key === "ArrowDown") keys.brake = true;
    });
    window.addEventListener("keyup", (e) => {
      if (e.key === "a" || e.key === "ArrowLeft") keys.left = false;
      if (e.key === "d" || e.key === "ArrowRight") keys.right = false;
      if (e.key === "w" || e.key === "ArrowUp") keys.gas = false;
      if (e.key === "s" || e.key === "ArrowDown") keys.brake = false;
    });

    function bindTouch(id, action) {
      const el = document.getElementById(id);
      el.addEventListener("touchstart", (e) => { e.preventDefault(); initAudio(); keys[action] = true; });
      el.addEventListener("touchend", (e) => { e.preventDefault(); keys[action] = false; });
    }
    bindTouch("btn-left", "left");
    bindTouch("btn-right", "right");
    bindTouch("btn-gas", "gas");
    bindTouch("btn-brake", "brake");

    function buyUpgrade() {
      if (wallet >= 100) {
        wallet -= 100;
        maxSpeed += 2.0;
        car.turnSpeed += 0.012;
        playChime(400, 880, 0.35);
        updateHUD();
      }
    }

    function updateHUD() {
      cashLabel.innerText = "CASH: $" + wallet;
      upgradeBtn.style.display = wallet >= 100 ? "block" : "none";
    }

    let crashCooldown = 0;

    function loop() {
      if (Math.abs(car.speed) > 0.4) {
        if (keys.left) car.angle -= car.turnSpeed;
        if (keys.right) car.angle += car.turnSpeed;
      }
      if (keys.gas) car.speed = Math.min(car.speed + car.accel, maxSpeed);
      else if (keys.brake) car.speed = Math.max(car.speed - car.accel * 1.3, -maxSpeed * 0.45);
      else car.speed *= car.friction;

      car.x += Math.cos(car.angle) * car.speed;
      car.y += Math.sin(car.angle) * car.speed;

      car.x = Math.max(25, Math.min(canvas.width - 25, car.x));
      car.y = Math.max(25, Math.min(canvas.height - 25, car.y));

      const isStopped = Math.abs(car.speed) < 0.35;

      if (crashCooldown > 0) crashCooldown--;

      for (let t of traffic) {
        t.x += t.speed;
        if (t.dir === 1 && t.x > canvas.width + 80) t.x = -80;
        if (t.dir === -1 && t.x < -80) t.x = canvas.width + 80;

        const dx = car.x - t.x;
        const dy = car.y - t.y;
        if (Math.abs(dx) < 32 && Math.abs(dy) < 22 && crashCooldown === 0) {
          playCrash();
          car.speed = -car.speed * 0.8;
          car.x += dx * 0.5;
          car.y += dy * 0.5;
          crashCooldown = 45;
          wallet = Math.max(0, wallet - 10);
          updateHUD();
          statusLabel.innerText = "CRASH! -$10 Repair Fee";
          statusLabel.style.color = "#ff4444";
        }
      }

      if (!hasPassenger && pickup.active) {
        if (Math.hypot(car.x - pickup.x, car.y - pickup.y) < pickup.r && isStopped) {
          hasPassenger = true;
          pickup.active = false;
          dropoff.x = Math.random() * (canvas.width - 220) + 110;
          dropoff.y = Math.random() * (canvas.height - 260) + 130;
          dropoff.active = true;
          statusLabel.innerText = "Deliver to the PINK circle!";
          statusLabel.style.color = "#ff0055";
          playChime(320, 640, 0.25);
        }
      }

      if (hasPassenger && dropoff.active) {
        if (Math.hypot(car.x - dropoff.x, car.y - dropoff.y) < dropoff.r && isStopped) {
          hasPassenger = false;
          dropoff.active = false;
          wallet += 50;
          updateHUD();
          statusLabel.innerText = "Fare Delivered! +$50";
          statusLabel.style.color = "#ffe600";
          playChime(550, 1100, 0.4);

          setTimeout(() => {
            pickup.x = Math.random() * (canvas.width - 220) + 110;
            pickup.y = Math.random() * (canvas.height - 260) + 130;
            pickup.active = true;
            statusLabel.innerText = "Stop inside the CYAN circle!";
            statusLabel.style.color = "#00f0ff";
          }, 1400);
        }
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(255, 255, 255, 0.04)";
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 60) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 60) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      ctx.setLineDash([15, 15]);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
      ctx.lineWidth = 2;
      for (let t of traffic) {
        ctx.beginPath(); ctx.moveTo(0, t.y); ctx.lineTo(canvas.width, t.y); ctx.stroke();
      }
      ctx.setLineDash([]);

      if (pickup.active) {
        ctx.fillStyle = "rgba(0, 240, 255, 0.2)";
        ctx.strokeStyle = "#00f0ff";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(pickup.x, pickup.y, pickup.r, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      }

      if (dropoff.active) {
        ctx.fillStyle = "rgba(255, 0, 85, 0.2)";
        ctx.strokeStyle = "#ff0055";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(dropoff.x, dropoff.y, dropoff.r, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      }

      for (let t of traffic) {
        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.fillStyle = t.color;
        ctx.shadowColor = t.color;
        ctx.shadowBlur = 8;
        ctx.fillRect(-t.w / 2, -t.h / 2, t.w, t.h);
        ctx.fillStyle = "#ffffff";
        if (t.dir === 1) {
          ctx.fillRect(t.w / 2 - 3, -t.h / 2 + 3, 3, 4);
          ctx.fillRect(t.w / 2 - 3, t.h / 2 - 7, 3, 4);
        } else {
          ctx.fillRect(-t.w / 2, -t.h / 2 + 3, 3, 4);
          ctx.fillRect(-t.w / 2, t.h / 2 - 7, 3, 4);
        }
        ctx.restore();
      }

      ctx.save();
      ctx.translate(car.x, car.y);
      ctx.rotate(car.angle);
      ctx.shadowColor = "#ffe600";
      ctx.shadowBlur = 10;
      ctx.fillStyle = "#ffe600";
      ctx.fillRect(-22, -12, 44, 24);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#0b0d14";
      ctx.fillRect(4, -9, 8, 18);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-4, -6, 6, 12);
      ctx.restore();

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
